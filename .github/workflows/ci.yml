name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  config-exe:
    uses: ./.github/workflows/build-config-exe.yml

  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,mcp,vision]

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [test, config-exe]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - uses: actions/download-artifact@v4
        with:
          name: configuration-exe
          path: src/easy_uiauto/bin

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify bundled configuration EXE
        run: python scripts/verify_config_bundle.py

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
