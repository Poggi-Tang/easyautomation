name: Build configuration EXE

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install EXE build tool
        run: python -m pip install pyinstaller==6.22.3
      - name: Build standalone configuration app
        run: python scripts/build_config_exe.py --bundle-package
      - uses: actions/upload-artifact@v4
        with:
          name: configuration-exe
          path: src/easy_uiauto/bin/easy-uiauto-config.exe
          if-no-files-found: error
