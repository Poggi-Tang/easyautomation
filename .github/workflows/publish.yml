name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  config-exe:
    uses: ./.github/workflows/build-config-exe.yml

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,mcp,vision]
      - name: Run tests
        run: pytest -q

  build:
    needs: [test, config-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag and package version
        run: |
          python - <<'PY'
          import ast, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          tree = ast.parse(pathlib.Path('src/easy_uiauto/__init__.py').read_text())
          declared = next(ast.literal_eval(node.value) for node in tree.body
                          if isinstance(node, ast.Assign)
                          and any(isinstance(target, ast.Name) and target.id == '__version__'
                                  for target in node.targets))
          assert declared == version, 'Package version mismatch'
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - uses: actions/download-artifact@v4
        with:
          name: configuration-exe
          path: src/easy_uiauto/bin
      - name: Build and validate artifacts
        run: |
          python -m build
          python scripts/verify_config_bundle.py
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  offline-bundle:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Download complete offline resources
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $wheel = (Get-ChildItem dist -Filter *.whl).FullName
          python -X utf8 src/easy_uiauto/deployment.py download offline --version $version --wheel $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify offline installation and inference
        shell: pwsh
        run: |
          $bundle = (Get-ChildItem offline -Directory).FullName
          python -X utf8 src/easy_uiauto/deployment.py install-offline $bundle --target "$env:RUNNER_TEMP/完整安装 smoke" --no-integrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone installation launchers
        run: python scripts/build_deployment_bootstrap.py --output-dir deployment
      - name: Prepare offline download asset
        shell: pwsh
        run: |
          $archive = (Get-ChildItem offline -Filter *.zip).FullName
          $destination = Join-Path (Resolve-Path offline) "easy-uiauto-offline-win-x64.zip"
          Move-Item -LiteralPath $archive -Destination $destination
          Move-Item -LiteralPath "$archive.sha256" -Destination "$destination.sha256"
          $digest = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$destination.sha256" -Value "$digest  easy-uiauto-offline-win-x64.zip" -Encoding ASCII
      - uses: actions/download-artifact@v4
        with:
          name: configuration-exe
          path: deployment
      - uses: actions/upload-artifact@v4
        with:
          name: complete-offline-assets
          path: |
            deployment/*
            offline/*.zip*
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [build, offline-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/easy-uiauto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: complete-offline-assets
          path: release-assets
      - name: Stage GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          tag = os.environ['GITHUB_REF_NAME']
          if subprocess.run(['gh', 'release', 'view', tag], capture_output=True).returncode:
              text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
              lines = text.split('## [' + tag[1:] + ']', 1)[1].splitlines()[1:]
              end = next((i for i, line in enumerate(lines) if line.startswith('## [')), len(lines))
              pathlib.Path('release-notes.md').write_text('\n'.join(lines[:end]).strip() + '\n', encoding='utf-8')
              subprocess.run(['gh', 'release', 'create', tag, '--draft', '--title', tag,
                              '--notes-file', 'release-notes.md'], check=True)
          assets = sorted(p for root in ('dist', 'release-assets') for p in pathlib.Path(root).rglob('*') if p.is_file())
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, assets), '--clobber'], check=True)
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
