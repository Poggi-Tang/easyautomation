name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: "${{ github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore(release): publish v0.7.3' }}"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/easy-uiauto

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad95d9c95a965a27b3d0784628abcc14e722ea6c

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
