name: Build ready-to-use GUI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare CPU inference and GUI build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[gui,image]" pyinstaller==6.22.3
          python -c "from easy_uiauto.image_detection import default_weights, ensure_weights; ensure_weights(default_weights())"
      - name: Build complete offline GUI ZIP
        shell: pwsh
        run: |
          $imagePython = (Get-Command python).Source
          python scripts/build_library_exe.py --image-python $imagePython --output-dir build/gui --package-dir dist/gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: easy-uiauto-gui-win-x64
          path: |
            dist/gui/*.zip
            dist/gui/*.sha256
          compression-level: 0
          if-no-files-found: error
