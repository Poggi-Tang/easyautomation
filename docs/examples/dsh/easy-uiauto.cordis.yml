# DeepSeek Harness overlay. Replace command with the Python that has easy-uiauto installed.
# Usage: dsh web --patch "C:/configs/easy-uiauto.cordis.yml"
- insert:
    - id: mcp-easy-uiauto
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: easy_uiauto
        transport: stdio
        command: 'C:/Python314/python.exe'
        args: ['-u', '-m', 'easy_uiauto.mcp.server']
        toolCallTimeoutMs: 600000
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
