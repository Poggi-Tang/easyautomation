[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-uiauto"
version = "1.1.5"
description = "Windows GUI automation with reusable controls, workflows, and a shared knowledge vault"
readme = "README.md"
license = "LicenseRef-easy-uiauto-Personal-Enterprise"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyautogui>=0.9.54",
    "pynput>=1.8.1",
    "uiautomation>=2.0.29",
    "pyperclip>=1.8.0",
    "build>=1.4.0",
]

keywords = ["auto", "ui", "uiauto", "automation", "gui-testing"]
authors = [
    {name = "Poggi-Tang", email = "2322806855@qq.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
mcp = [
    "mcp[cli]>=1.0.0,<2.0.0",
]
vision = [
    "opencv-python>=4.8",
    "pytesseract>=0.3.10",
]
gui = [
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<6",
    "PySide6-Essentials>=6.10,<6.11",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.8",
]
image = [
    "torch>=2.0",
    "rapidocr==3.10.0",
    "onnxruntime>=1.20",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.8",
]
full = [
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<6",
    "PySide6-Essentials>=6.10,<6.11",
    "mcp[cli]>=1.0.0,<2.0.0",
    "opencv-python>=4.8",
    "pytesseract>=0.3.10",
    "torch>=2.0",
    "rapidocr==3.10.0",
    "onnxruntime>=1.20",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Poggi-Tang/easyautomation"
Repository = "https://github.com/Poggi-Tang/easyautomation.git"
Issues = "https://github.com/Poggi-Tang/easyautomation/issues"
Changelog = "https://github.com/Poggi-Tang/easyautomation/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Poggi-Tang/easyautomation/blob/main/README.md"

[project.scripts]
easy_uiauto = "easy_uiauto.mcp.server:main"
easy_uiauto_service = "easy_uiauto.mcp.service:main"
easy_uiauto_ui = "easy_uiauto.mcp.ui_cli_command:main"
easy_uiauto_image = "easy_uiauto.image_cli:main"
easy_uiauto_setup = "easy_uiauto.deployment:main"

[project.gui-scripts]
easy_uiauto_config = "easy_uiauto.mcp.config_launcher:main"
easy_uiauto_library = "easy_uiauto.library_launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
easy_uiauto = ["py.typed", "skills/*/SKILL.md", "skills/*/agents/openai.yaml", "skills/*/references/*.md", "bin/*.exe", "resources/*.png", "resources/*.ico", "resources/icons/*.svg", "resources/icons/*.json", "resources/icons/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.coverage.run]
source = ["src/easy_uiauto"]
branch = true
omit = ["*/test/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["easy-uiauto"]
